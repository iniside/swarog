<!-- @dsCard group="Data" height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { height: auto; }
  .pv { padding: 16px; display: grid; gap: 12px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .pv-row > * { flex: 1 1 380px; min-width: 0; }
  
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var S = window.Swarog;
  document.getElementById("root").innerHTML = S.Panel({ c: { module: "lore", point: "page", prim: "TimeSeriesChart" }, noForce: true, title: "Seats and store over time",
    tools: '<div class="legend"><span><i style="background:var(--chart-1)"></i>Seats</span><span><i style="background:var(--chart-2)"></i>Store (TB)</span></div>',
    body: S.TimeSeriesChart({ labels: ["May", "Jun", "Jul", "Aug", "Sep", "Oct"], right: true, aria: "Seats and TB per month", series: [{ values: [5, 6, 6, 7, 8, 8], max: 10, color: "var(--chart-1)", unit: "seats" }, { values: [6.2, 7.4, 8.9, 10.6, 12.1, 13.29], max: 15, color: "var(--chart-2)", unit: "TB" }] }) });
</script>
</body>
</html>
