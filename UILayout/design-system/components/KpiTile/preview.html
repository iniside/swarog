<!-- @dsCard group="Data" height=150 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { height: auto; }
  .pv { padding: 16px; display: grid; gap: 12px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .pv-row > * { flex: 1 1 380px; min-width: 0; }
  
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var S = window.Swarog;
  var c = { module: "lore", point: "dashboard.tile", prim: "KpiTile" };
  document.getElementById("root").innerHTML = '<div class="pv-row">' +
    S.KpiTile({ c: { module: "storage", point: "dashboard.tile", prim: "KpiTile" }, noForce: true, label: "Cloud saves used", value: "1.82", unit: "TB", delta: "64 MB quota / player", spark: [1.5, 1.55, 1.6, 1.64, 1.7, 1.76, 1.82], sparkColor: "var(--chart-2)" }) +
    S.KpiTile({ c: { module: "accounts", point: "dashboard.tile", prim: "KpiTile" }, noForce: true, label: "Active players (24 h)", value: "38,412", delta: '<span class="up">▲ 6.1%</span> vs prev. day', spark: [31, 30, 33, 32, 35, 34, 36, 35, 37, 38.4] }) +
    S.KpiTile({ c: { module: "wallet", point: "dashboard.tile", prim: "KpiTile" }, noForce: true, label: "Embers spent (24 h)", value: "1.94 M", state: "error" }) +
    S.KpiTile({ c: c, noForce: true, label: "Pushes (24 h)", value: "41", state: "loading" }) + '</div>';
</script>
</body>
</html>
