[package]
name = "admin-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Composition root: the core admin portal plus metrics; no domain module; DB-backed.
# No edge server of its own (it only DIALS each peer's `cp.*` face through one
# `remote::Stub` per peer), fronted for browsers through gateway-svc's HTTP passthrough.
[dependencies]
app = { workspace = true }
lifecycle = { workspace = true }
metrics = { workspace = true }
admin = { workspace = true }
remote = { workspace = true }
controlplanerpc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
