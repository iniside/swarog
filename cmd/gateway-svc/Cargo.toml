[package]
name = "gateway-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The dedicated front-door process (port of Go's `cmd/gateway-svc`): a PURE transport
# process. It hosts no provider module and no DB — every op it fronts resolves Remote
# over a `remote::Stub`. It imports neither `characters` nor `inventory` IMPL crate,
# only their `<name>rpc` glue (to pass `remote_factories()` into the generic
# `remote::Stub`, Step 4 — sanctioned for cmd/*, rule 5), so the linker drops the impl
# packages this binary never names.
[[bin]]
name = "gateway-svc"
path = "src/main.rs"

[dependencies]
app = { workspace = true }
edge = { workspace = true }
lifecycle = { workspace = true }
metrics = { workspace = true }
gateway = { workspace = true }
remote = { workspace = true }
# D2 routing-as-data: the pure-HTTP providers' routes arrive at RUNTIME via each peer's
# `__describe` manifest, so this binary imports NO `charactersrpc`/`inventoryrpc`/`matchrpc`/
# `leaderboardrpc` glue. Only accounts/apikeys keep a glue dep — for their sync CAPABILITY
# client (`provide_factories`), NOT routes.
accountsrpc = { workspace = true }
apikeysrpc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# Pins the process-global crypto provider to ring at main start (admin hardening
# Step 4) — the default-provider builders inside axum-server/rustls-acme then resolve
# to ring, never aws-lc-rs.
rustls = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The generic `remote::Stub` swap integration test (`tests/stub_swap.rs`) names the PURE api
# traits + route bindings, the registry key helper, and the `<name>rpc` glue crates it feeds.
# Under D2 the BINARY no longer imports `charactersrpc`/`inventoryrpc` (routes come from
# `__describe`), so they move HERE — the generic-Stub swap mechanism they exercise is still
# worth a dev test, independent of how gateway-svc wires its own routes.
charactersapi = { workspace = true }
inventoryapi = { workspace = true }
charactersrpc = { workspace = true }
inventoryrpc = { workspace = true }
opsapi = { workspace = true }
registry = { workspace = true }
