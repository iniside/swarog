[package]
name = "mail-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The mail fortress process. Hosts mail and stands up one shared QUIC edge server
# (EDGE_ADDR) so admin-svc can fetch/submit its admin page over the mTLS edge. mail owns
# schema `mail` and a durable subscription (`mail.send-requested.v1`), so it needs a DB
# pool and thus hosts the durable-events plane (app-owned, DB => plane). It dials NO peer:
# `requires()` is empty, so it hosts no `remote::Stub` beyond what `metrics` brings. It
# hosts NO gateway (FrontDoor) — the single public front door lives only in gateway-svc +
# the monolith — and it serves no #[http] ops at all: mail's only ingress is the durable
# log.
[[bin]]
name = "mail-svc"
path = "src/main.rs"

[dependencies]
app = { workspace = true }
edge = { workspace = true }
lifecycle = { workspace = true }
metrics = { workspace = true }
mail = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
