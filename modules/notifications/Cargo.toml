[package]
name = "notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The notifications impl module: owns schema `notifications` (the per-player in-app
# inbox) and provides the player-facing `Player` capability (list/mark_read/delete).
# [`Service::deliver_on`] is the single insert authority — it runs on a CALLER-OWNED
# connection and never touches transaction control, so operator mail and the durable
# fan-in share one implementation instead of growing two ways to address a player.
# An impl crate — no OTHER module imports it; consumers would use `notificationsapi`.
# `notificationsrpc` is its OWN glue (sanctioned): the edge register_server faces.
[dependencies]
lifecycle = { workspace = true }
registry = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
notificationsapi = { workspace = true }
notificationsrpc = { workspace = true }
bus = { workspace = true }
# The admin CONTRACT (widgets + the AdminData/AdminSubmit traits) and the accounts api crate
# for the `PLAYERS_ROW_MENU` extension-point const the "View Inbox" entry targets — contract
# crates, importable by any module; neither impl is ever reached.
adminapi = { workspace = true }
accountsapi = { workspace = true }
# The render-time dedup key the admin form round-trips (OsRng, not a clock).
rand = { workspace = true }
sqlx = { workspace = true }
# The two fan-in EVENT contracts and the scheduler one (events crates are importable by any
# module; the impl crates are not).
walletevents = { workspace = true }
accountsevents = { workspace = true }
schedulerevents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
# The opaque paging cursor is base64url-no-pad over `"{created_at}|{id}"`.
base64 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# The admin `RenderFn` is synchronous while the page's store reads are not: the local render
# bridges through `block_in_place` on the multi-thread runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The durable plane, driven by hand: `asyncevents::testing::TestTransport` gives the fan-in
# tests a REAL append + delivery pass with no background workers and no clock.
asyncevents = { workspace = true }
