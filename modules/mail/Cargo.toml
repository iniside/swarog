[package]
name = "mail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The mail impl module: owns schema `mail` (the outbound outbox) and consumes the
# `mail.send_requested` command topic it also defines — the deliberate deviation
# recorded in `mailevents`' crate doc. It provides NO sync capability (there is no
# `mailapi`): a sender appends the durable event and never waits for a relay.
# An impl crate — no OTHER module imports it.
[dependencies]
lifecycle = { workspace = true }
bus = { workspace = true }
opsapi = { workspace = true }
mailevents = { workspace = true }
# The retention sweep's zero-coupling subscription to `scheduler.fired` (audit's shape:
# subscribe by the contract topic const, without importing a sync capability).
schedulerevents = { workspace = true }
sqlx = { workspace = true }
# The drain loop: a spawned task, a watch stop channel, and every DB/send bound.
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
# Deserializes just the `name` field of a `scheduler.fired` payload for the prune sweep.
serde = { workspace = true }
serde_json = { workspace = true }
# The no-provider `/readyz` check: a process accepting mail it cannot deliver is not ready.
httpmw = { workspace = true }
# The internal mTLS edge: the module contributes its admin faces to `EDGE_SLOT`
# unconditionally and never learns whether this process serves one.
edge = { workspace = true }
# The admin CONTRACT (widgets + the AdminData/AdminSubmit traits) — a contract crate,
# importable by any module. `mailrpc` is this module's OWN glue: the cross-cutting admin
# fan-out's server-side register_admin/register_admin_submit.
adminapi = { workspace = true }
mailrpc = { workspace = true }
# The render-time idempotency key the admin test-send form round-trips (OsRng, not a clock).
rand = { workspace = true }
# The enqueue counters ride core/metrics' private registry, so they appear on the same
# GET /metrics as every plane counter.
metrics = { workspace = true }
prometheus = { workspace = true }
# The `smtp` provider's transport. rustls/ring, no native-tls, no connection pool.
lettre = { workspace = true }
