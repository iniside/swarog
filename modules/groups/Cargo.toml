[package]
name = "groups"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The groups impl module: owns schema `groups` (one row per group, one per membership)
# and provides the player-facing `Player` capability (create/list_mine/members/pending/
# join/leave/invite/respond/decide). It CONSUMES `accountsapi::Directory` to resolve an
# invite target's handle and to hydrate a page's handles — a contract crate, so the
# accounts impl is never reached. An impl crate: no other module imports it. `groupsrpc`
# is its OWN glue (sanctioned): the edge register_server faces.
[dependencies]
lifecycle = { workspace = true }
registry = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
groupsapi = { workspace = true }
groupsrpc = { workspace = true }
groupsevents = { workspace = true }
# The directory capability's CONTRACT (`Directory`, `PlayerSummary`) plus the byte cap on
# a handle — the one authority for that bound, so groups declares no second const.
accountsapi = { workspace = true }
bus = { workspace = true }
sqlx = { workspace = true }
# The opaque paging cursor is base64url-no-pad over `"{created_at}|{id}"`.
base64 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# The scheduler fan-in the retention sweep reacts to (`scheduler.fired{groups-prune}`).
schedulerevents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
