[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lifecycle = { workspace = true }
registry = { workspace = true }
opsapi = { workspace = true }
# The accounts CONTRACT crate (rule 4 / the dependency law: contract crates of any
# domain are importable by a module) — names `dyn Sessions` for the verifier
# adapter. NEVER the accounts impl crate, never accountsrpc (archcheck enforces).
accountsapi = { workspace = true }
# The apikeys CONTRACT crate (same rule) — names `dyn Keys` for the key-verifier
# adapter. NEVER the apikeys impl crate, never apikeysrpc (archcheck enforces).
apikeysapi = { workspace = true }
edge = { workspace = true }
# `remote::Pool` — the client-side round-robin caller the route table builds per provider
# to load-balance HTTP-dispatched Remote ops across a provider's resolved instance set
# (C2). A core transport crate (not a module), so no fortress violation; `remote` imports
# no `api/` crate, no cycle.
remote = { workspace = true }
contrib = { workspace = true }
# The push hub MODEL (`ConnId`/`Target`/`Message`/`Sink`) — a foundation leaf owning no
# transport; this module owns the socket that carries it and resolves a target against
# the connections it holds.
push = { workspace = true }
# The client-facing frame carries a producer's OPAQUE payload bytes, base64-encoded so a
# non-UTF-8 payload survives a JSON frame (the same crate accounts/apikeys already use).
base64 = { workspace = true }
# The shared route-pattern label seam (`httpmw::RoutePattern`): the front door stamps a
# matched op's route pattern onto the response so `core/metrics` labels op traffic by
# pattern instead of the fixed "unmatched". A core leaf (no cycle: httpmw imports no module).
httpmw = { workspace = true }
# `IpNet`: the trusted-proxy set the `/push` per-IP cap resolves a client address against,
# parsed by `httpmw::parse_cidrs` and carried in the limits the composition root injects.
ipnet = { workspace = true }
axum = { workspace = true }
# The HTTP reverse-proxy passthrough (Go's httpproxy): reqwest is the workspace client
# already used by accounts (Epic OIDC/OAuth); the `stream` feature streams the
# response body back (`bytes_stream`). The request body streams via `Body::wrap` (axum
# `Body` is an `http_body::Body`), no extra crate needed.
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# test-util: start_paused virtual clock for the flight-lock parallelism proof.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "test-util"] }
tower = { version = "0.5", features = ["util"] }
futures = { workspace = true }
# The `/push` proofs need a real RFC 6455 client against a bound listener: the suite's
# `oneshot` requests carry no `hyper::upgrade::OnUpgrade`, so no upgrade can happen off a
# socket. Same 0.24 line axum's `ws` feature already locks (and `core/app`'s Step 9a proof
# uses), default features — no TLS stack, no new lock entries.
tokio-tungstenite = "0.24"
