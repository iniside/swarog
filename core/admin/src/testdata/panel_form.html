<div class="slot" data-panel-url="&#x2f;admin&#x2f;_panel&#x2f;golden&#x2f;panel" data-state="ok">
<section class="panel">
<div class="panel-head">
<span class="muted">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<rect x="3.5" y="4" width="17" height="7" rx="1.5"/>
<rect x="3.5" y="13" width="17" height="7" rx="1.5"/>
<path d="M7 7.5h.01M7 16.5h.01"/>
</svg>
</span>
<span class="panel-title">Golden panel</span>
<div class="panel-tools">
</div>
</div>
<div class="panel-body">
<form hx-post="&#x2f;admin&#x2f;_action&#x2f;golden&#x2f;save" hx-target="closest .slot" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
<input type="hidden" name="_csrf" value="csrf-golden">
<input type="hidden" name="_form" value="form-golden-1">
<div class="form">
<label class="fl">Display name <span style="color:var(--err)">*</span>
<span class="type">string</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="display_name" value="Anna" required>
<div class="help">Shown to other players.</div>
</div>
<label class="fl">Bio<span class="type">text</span>
</label>
<div>
<textarea class="input" rows="4" style="width:100%" name="bio">
</textarea>
</div>
<label class="fl">Level<span class="type">int</span>
</label>
<div>
<input class="input num" style="width:100%;max-width:520px" name="level" value="12" inputmode="numeric">
</div>
<label class="fl">Drop ratio<span class="type">float</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="ratio" value="0.25">
</div>
<label class="fl">Muted<span class="type">bool</span>
</label>
<div>
<span class="toggle on" role="switch" aria-checked="true" tabindex="0" data-toggle data-default="true">
</span>
<input type="hidden" name="muted" value="true">
</div>
<label class="fl">Tier<span class="type">enum</span>
</label>
<div>
<select class="select" style="width:260px" name="tier">
<option>free</option>
<option selected>plus</option>
<option>pro</option>
</select>
</div>
<label class="fl">Regions<span class="type">multi</span>
</label>
<div>
<div class="checks">
<label>
<input type="checkbox" name="regions" value="eu" checked> <span class="mono">eu</span>
</label>
<label>
<input type="checkbox" name="regions" value="us"> <span class="mono">us</span>
</label>
<label>
<input type="checkbox" name="regions" value="asia" checked> <span class="mono">asia</span>
</label>
</div>
</div>
<label class="fl">Meta<span class="type">json</span>
</label>
<div>
<textarea class="input mono" rows="4" style="width:100%" name="meta" readonly>{&quot;v&quot;:1}</textarea>
</div>
<label class="fl">Owner<span class="type">ref player</span>
</label>
<div>
<span class="input-icon">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>
</svg>
<input class="input" style="width:260px" name="owner" value="p-1001" placeholder="player id">
</span>
</div>
<label class="fl">Credit<span class="type">money</span>
</label>
<div>
<div class="row">
<input class="input num" style="width:140px" name="credit" value="9.99" inputmode="decimal">
<select class="select" style="width:110px" name="credit__currency">
<option selected>EUR</option>
<option>USD</option>
</select>
</div>
</div>
<label class="fl">Cooldown<span class="type">duration</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="cooldown" value="30m">
</div>
<label class="fl">Request id<span class="type">idempotency key</span>
</label>
<div>
<input class="input mono" style="width:100%;max-width:520px" value="form-golden-1" readonly>
</div>
<div class="form-actions">
<span class="muted" style="margin-right:auto;font-size:12px;align-self:center">Changes apply on next login.</span>
<button type="reset" class="btn">Cancel</button>
<button type="submit" class="btn primary">Save profile</button>
</div>
</div>
</form>
</div>
</section>
</div>
