<div class="slot" data-panel-url="&#x2f;admin&#x2f;_panel&#x2f;golden&#x2f;panel" data-state="readonly">
<section class="panel">
<div class="panel-head">
<span class="muted">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<rect x="3.5" y="4" width="17" height="7" rx="1.5"/>
<rect x="3.5" y="13" width="17" height="7" rx="1.5"/>
<path d="M7 7.5h.01M7 16.5h.01"/>
</svg>
</span>
<span class="panel-title">Golden panel</span>
<span class="ro-chip">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
<path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
</svg> read-only</span>
<div class="panel-tools">
<button type="button" class="btn sm" hx-post="&#x2f;admin&#x2f;_action&#x2f;golden&#x2f;refresh" hx-vals="{&quot;_csrf&quot;:&quot;csrf-golden&quot;}" hx-target="#modal-root" hx-swap="innerHTML" hx-disabled-elt="this">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/>
<path d="M4 3.5V8h4.5"/>
<path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/>
<path d="M20 20.5V16h-4.5"/>
</svg> Refresh</button>
<button type="button" class="btn sm" disabled title="Not permitted for your role" data-refused-action="golden/purge" data-refusal="denied">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<path d="M4 7h16"/>
<path d="M9 7V4.5h6V7"/>
<path d="M6 7l1 13h10l1-13"/>
</svg> Purge</button>
</div>
</div>
<div class="banner info">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="12" r="8.5"/>
<path d="M12 11v5.5M12 7.5h.01"/>
</svg> Read-only: the <b>golden</b> module does not accept remote edits from the portal.</div>
<div class="panel-body">
<div class="form">
<label class="fl">Display name <span style="color:var(--err)">*</span>
<span class="type">string</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="display_name" value="Anna" required disabled>
<div class="help">Shown to other players.</div>
</div>
<label class="fl">Bio<span class="type">text</span>
</label>
<div>
<textarea class="input" rows="4" style="width:100%" name="bio" disabled>
</textarea>
</div>
<label class="fl">Level<span class="type">int</span>
</label>
<div>
<input class="input num" style="width:100%;max-width:520px" name="level" value="12" inputmode="numeric" disabled>
</div>
<label class="fl">Drop ratio<span class="type">float</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="ratio" value="0.25" disabled>
</div>
<label class="fl">Muted<span class="type">bool</span>
</label>
<div>
<span class="toggle on" role="switch" aria-checked="true">
</span>
<input type="hidden" name="muted" value="true" disabled>
</div>
<label class="fl">Tier<span class="type">enum</span>
</label>
<div>
<select class="select" style="width:260px" disabled>
<option>free</option>
<option selected>plus</option>
<option>pro</option>
</select>
</div>
<label class="fl">Regions<span class="type">multi</span>
</label>
<div>
<div class="checks">
<label>
<input type="checkbox" name="regions" value="eu" checked disabled> <span class="mono">eu</span>
</label>
<label>
<input type="checkbox" name="regions" value="us" disabled> <span class="mono">us</span>
</label>
<label>
<input type="checkbox" name="regions" value="asia" checked disabled> <span class="mono">asia</span>
</label>
</div>
</div>
<label class="fl">Meta<span class="type">json</span>
</label>
<div>
<textarea class="input mono" rows="4" style="width:100%" name="meta" disabled>{&quot;v&quot;:1}</textarea>
</div>
<label class="fl">Owner<span class="type">ref player</span>
</label>
<div>
<span class="input-icon">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>
</svg>
<input class="input" style="width:260px" name="owner" value="p-1001" placeholder="player id" disabled>
</span>
</div>
<label class="fl">Credit<span class="type">money</span>
</label>
<div>
<div class="row">
<input class="input num" style="width:140px" name="credit" value="9.99" inputmode="decimal" disabled>
<select class="select" style="width:110px" disabled>
<option selected>EUR</option>
<option>USD</option>
</select>
</div>
</div>
<label class="fl">Cooldown<span class="type">duration</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="cooldown" value="30m" disabled>
</div>
<div class="form-actions">
<span class="muted" style="margin-right:auto;font-size:12px;align-self:center">Changes apply on next login.</span>
<button type="reset" class="btn" disabled>Cancel</button>
<button type="button" class="btn primary" disabled title="Read-only">Save profile</button>
</div>
</div>
</div>
</section>
</div>
