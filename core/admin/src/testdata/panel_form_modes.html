<div class="slot" data-panel-url="&#x2f;admin&#x2f;_panel&#x2f;golden&#x2f;panel" data-state="ok">
<section class="panel">
<div class="panel-head">
<span class="muted">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<rect x="3.5" y="4" width="17" height="7" rx="1.5"/>
<rect x="3.5" y="13" width="17" height="7" rx="1.5"/>
<path d="M7 7.5h.01M7 16.5h.01"/>
</svg>
</span>
<span class="panel-title">Golden panel</span>
<div class="panel-tools">
</div>
</div>
<div class="panel-body">
<form hx-post="&#x2f;admin&#x2f;_action&#x2f;golden&#x2f;save" hx-target="closest .slot" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
<input type="hidden" name="_csrf" value="csrf-golden">
<input type="hidden" name="_form" value="form-golden-1">
<input type="hidden" name="_mode" value="grant">
<div class="seg" style="margin-bottom:12px">
<button type="button" class="on" data-mode-default data-mode="grant" data-submit-label="Grant">Grant</button>
<button type="button" data-mode="revoke" data-submit-label="Revoke">Revoke</button>
</div>
<div class="form">
<label class="fl">Player <span style="color:var(--err)">*</span>
<span class="type">ref user</span>
</label>
<div>
<span class="input-icon">
<svg class="i " viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>
</svg>
<input class="input" style="width:260px" name="player" value="" placeholder="user id" required>
</span>
</div>
<label class="fl">Amount<span class="type">money</span>
</label>
<div>
<div class="row">
<input class="input num" style="width:140px" name="amount" value="" inputmode="decimal">
<select class="select" style="width:110px" name="amount__currency">
<option>EMB</option>
<option>GLD</option>
</select>
</div>
</div>
<label class="fl">Reason <span style="color:var(--err)">*</span>
<span class="type">string</span>
</label>
<div>
<input class="input" style="width:100%;max-width:520px" name="reason" value="" required>
</div>
<label class="fl">Request id<span class="type">idempotency key</span>
</label>
<div>
<input class="input mono" style="width:100%;max-width:520px" value="form-golden-1" readonly>
</div>
<div class="form-actions">
<span class="muted" style="margin-right:auto;font-size:12px;align-self:center">Idempotent per request id.</span>
<button type="reset" class="btn">Cancel</button>
<button type="submit" class="btn primary">Grant</button>
</div>
</div>
</form>
</div>
</section>
</div>
