[package]
name = "admin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The GameOps admin module (port of Go's modules/admin, hardened for public
# deployment). It owns the GameOps identity: schema `admin` (users / sessions /
# login_attempts), argon2id session login with asymmetric lockout, CSRF on logout,
# and the durable `admin.action` audit trail. Imports only contract crates +
# foundations.
# `tools/adminctl` (an operator CLI, not a module) reuses `USERS_DDL` + the pub
# password fns — one source of truth, no drift.
[dependencies]
controlplane = { workspace = true }
lifecycle = { workspace = true }
async-trait = { workspace = true }
bus = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
minijinja = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
# Trusted-proxy-aware client-IP resolution for the login lockout (core infra crate,
# same helpers `core/app`'s rate limiter uses; honors TRUSTED_PROXY_CIDRS).
httpmw = { workspace = true }
ipnet = { workspace = true }
asyncevents = { workspace = true }

[dev-dependencies]
testdb = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
