[package]
name = "partyrpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The party domain's GENERATED transport glue: the edge-dependent half of the `#[rpc]`
# codegen. It expands `partyapi`'s metadata-callback macro through
# `rpc_macro::generate_glue` into `Client` / `register_server` / `provide_remote`.
# Impl-tier: may import `edge`; reached ONLY by the `party` module itself (its own glue
# is sanctioned) and `cmd/*` — NEVER by a domain consumer (they import `partyapi`,
# rule 4).
#
# No `remote_factories()`/`provide_factories()` aggregator: no other process consumes a
# party CAPABILITY (gateway-svc contributes party's routes via `Stub::describe_peer`, and
# the monolith is local). No `adminrpc` re-export: party has no admin page.
[dependencies]
partyapi = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
registry = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
