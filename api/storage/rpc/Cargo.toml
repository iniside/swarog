[package]
name = "storagerpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The storage domain's GENERATED transport glue: the edge-dependent half of the `#[rpc]`
# codegen. It expands `storageapi`'s metadata-callback macro through
# `rpc_macro::generate_glue` into `Client` / `register_server` / `provide_remote`.
# Impl-tier: may import `edge`; reached ONLY by the `storage` module itself (its own glue
# is sanctioned) and `cmd/*` — NEVER by a domain consumer (they import `storageapi`,
# rule 4).
#
# No `remote_factories()`/`provide_factories()` aggregator: no other process consumes a
# storage CAPABILITY (gateway-svc contributes storage's routes via `Stub::describe_peer`,
# and the monolith is local), so an aggregator would pin a public symbol nothing calls.
[dependencies]
storageapi = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
registry = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
