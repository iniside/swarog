[package]
name = "friendsevents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The published event vocabulary of the friends domain: the Requested/Accepted/Removed
# payloads + their topic descriptors. The ONLY surface consumers (audit and notifications)
# share with friends; nobody imports the friends implementation. The topics ride the
# DURABLE plane (bus::emit_tx, atomic with the `friends.edges` write), so the payloads are
# serde (the transport collapses them to JSON at the emit_tx/on_tx boundary). Imports only
# the `bus` leaf.
[dependencies]
bus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
