[package]
name = "friendsrpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The friends domain's GENERATED transport glue: the edge-dependent half of the `#[rpc]`
# codegen. It expands `friendsapi`'s metadata-callback macro through
# `rpc_macro::generate_glue` into `Client` / `register_server` / `provide_remote`, and
# re-exports the cross-cutting admin registration so the friends module reaches it through
# its OWN glue crate (archcheck forbids a module→foreign-rpc edge). Impl-tier: may import
# `edge`; reached ONLY by the `friends` module itself and `cmd/*` — NEVER by a domain
# consumer (they import `friendsapi`, rule 4).
#
# Deliberately NO `remote_factories()`/`provide_factories()` aggregator, hence no
# `remote`/`lifecycle` dependency: nothing consumes a friends CAPABILITY remotely
# (gateway-svc contributes its routes via `Stub::describe_peer`, admin-svc via
# `adminrpc::admin_remote_factory`, and the monolith is local), so the aggregators would
# be dead code naming those crates for nothing.
[dependencies]
friendsapi = { workspace = true }
# The cross-cutting admin fan-out glue, re-exported (`register_admin`) so the friends
# module reaches it through its OWN rpc crate.
adminrpc = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
registry = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
