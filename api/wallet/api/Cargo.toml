[package]
name = "walletapi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The wallet module's PURE, transport-free capability contract: the wire-only
# `Wallet` capability (balances/currencies/credit/debit) + the player-facing
# `Player` reads, plus the `Balance`/`Currency`/`Movement` wire types and the input
# byte caps. `#[rpc]` generates the transport-FREE surface (wire envelopes,
# METHOD_* consts, operations()/route_bindings()) into child `*_rpc` modules, plus
# the metadata-callback macros the sibling `walletrpc` glue crate expands into the
# edge-dependent glue. NO `edge`/`remote`/transport dependency (archcheck's
# FORBIDDEN_API_DEPS) — a future consumer that needs `dyn Wallet` imports THIS crate
# to name the trait (rule 4's nominal-typing cost), never the `wallet` impl crate.
[dependencies]
opsapi = { workspace = true }
# TYPES-ONLY: the admin extension-point vocabulary, the same api→api edge
# `charactersapi` carries. Reserved for wallet's admin surface; this crate names no
# `adminapi` symbol yet (the wallet page and its extension entry land later).
adminapi = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
