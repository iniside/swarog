[package]
name = "groupsrpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The groups domain's GENERATED transport glue: the edge-dependent half of the
# `#[rpc]` codegen. It expands `groupsapi`'s two metadata-callback macros through
# `rpc_macro::generate_glue` into `Client` / `register_server` / `provide_remote` per
# capability. Impl-tier: may import `edge`; reached ONLY by the `groups` module itself
# (its own glue is sanctioned) and `cmd/*` — NEVER by a domain consumer (they import
# `groupsapi`, rule 4).
#
# No `remote_factories()`/`provide_factories()` aggregator YET, hence no
# `remote`/`lifecycle` dependency: no OTHER process consumes a groups CAPABILITY today
# (gateway-svc contributes groups' routes via `Stub::describe_peer`, and the monolith is
# local), so an aggregator would pin a public symbol nothing calls. The first
# `Membership` consumer adds it.
[dependencies]
groupsapi = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
registry = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
