[package]
name = "groupsrpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The groups domain's GENERATED transport glue: the edge-dependent half of the
# `#[rpc]` codegen. It expands `groupsapi`'s two metadata-callback macros through
# `rpc_macro::generate_glue` into `Client` / `register_server` / `provide_remote` per
# capability, and re-exports the cross-cutting admin registrations so the groups
# module reaches them through its OWN glue crate (archcheck forbids a module→foreign
# -rpc edge). Impl-tier: may import `edge`; reached ONLY by the `groups` module itself
# (its own glue is sanctioned) and `cmd/*` — NEVER by a domain consumer (they import
# `groupsapi`, rule 4).
#
# Deliberately NO `remote_factories()`/`provide_factories()` aggregator, hence no
# `remote`/`lifecycle` dependency: nothing consumes a groups CAPABILITY remotely
# (gateway-svc contributes groups' routes via `Stub::describe_peer`, admin-svc via
# `adminrpc::admin_remote_factory`, and the monolith is local), so the aggregators
# would be dead code naming those crates for nothing.
[dependencies]
groupsapi = { workspace = true }
# The cross-cutting admin fan-out glue, re-exported (`register_admin` /
# `register_admin_submit`) so the groups module reaches it through its OWN rpc crate.
adminrpc = { workspace = true }
opsapi = { workspace = true }
edge = { workspace = true }
registry = { workspace = true }
rpc-macro = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
