[package]
name = "eventctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The durable-event-log operator CLI: inspect subscriptions/lag and drive the
# recovery verbs (retry/pause/resume/skip/retire/bump-generation) against the shared
# `asyncevents` schema over `DATABASE_URL`. Hand-rolled arg parsing (like the other
# tools/ crates); the operations live in `asyncevents::admin`, main is a thin
# dispatcher that prints their results.
[[bin]]
name = "eventctl"
path = "src/main.rs"

[dependencies]
asyncevents = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
