[package]
name = "playercli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A CLI driver for the QUIC player front. It dials `edge::PlayerClient` with a key-less
# `TrustAnchor` (a CA certificate or the OS trust store, never the CA signing key) and
# fires one call, printing the raw response payload.
[[bin]]
name = "playercli"
path = "src/main.rs"

[dependencies]
edge = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
