[package]
name = "splitproof"
version = "0.1.0"
edition = "2021"
publish = false

# Cross-platform split-proof harness. Replaces split-proof.sh/.ps1: the fleet is
# spawned as child processes with a typed env map and a kill-on-drop guard (no shell,
# so no PowerShell arg-quoting / MSYS job-control / winctrl bugs), health-checked over
# reqwest, DB-asserted via sqlx, and the player QUIC front driven through the `edge`
# crate as a library. See docs/plans/2026-07-11-1730-rust-splitproof-harness-plan.md.

[dependencies]
edge = { path = "../../core/edge" }
processctl = { path = "../processctl" }
tokio = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
# Recompute the apikeys secret hash (base64url(sha256(secret))) inside the [AD6]
# cross-process rich-form assertion, proving the show-once secret is exactly what the
# apikeys store persisted as `secret_hash` — must use the SAME encoding as
# modules/apikeys/src/store.rs::secret_hash (URL_SAFE_NO_PAD, NOT hex).
sha2 = { workspace = true }
base64 = { workspace = true }
# The loopback OIDC fixture ([A8]/[WL8]): promotion needs a NON-guest identity, and the
# only production link path is a verified id_token — so the harness generates an RSA key,
# serves its JWKS at `PROOF_OIDC_JWKS_URL` and mints RS256 tokens the Proof fleet's `epic`
# provider accepts. No live identity provider is ever contacted.
axum = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
rsa = { version = "0.9", features = ["pem"] }
# The `[PH*]` push-hub assertions. `tokio-tungstenite` is in the tree only
# TRANSITIVELY (axum's `ws` feature pulls it), and a transitive dependency is not a
# usable one — the harness needs its own entry to drive `GET /push` as a CLIENT. Pinned
# to the version axum 0.7 already resolves, default features off plus the two the dial
# needs, so no TLS stack (and therefore no `aws-lc-rs`) can enter through it: the
# WebSocket rides plain loopback HTTP.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures = { workspace = true }
# The hub model itself: [PH4] addresses a `push::Target::Group` by encoding a batch with
# the SAME `push::encode_batch` `core/remote` uses, so a codec change breaks the proof
# instead of silently reshaping the wire.
push = { workspace = true }
# `notificationsapi::PUSH_NEW_TOPIC` — the frame's dispatch key lives in the contract
# crate precisely so the module and this harness cannot drift; re-typing the literal here
# would defeat the reason it was moved there.
notificationsapi = { workspace = true }

# The fleet-liveness tests drive processctl's production spawn path, which on unix
# re-execs `current_exe --__processctl-guardian-v1`; only a `harness = false`
# target can dispatch that guardian before the tests run (a libtest binary has no
# such early hook and exits 101 on the re-exec). Same shape as devctl's
# `supervised` fixture (Step 8b).
[[test]]
name = "fleet_liveness"
path = "tests/fleet_liveness.rs"
harness = false
