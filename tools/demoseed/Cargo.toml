[package]
name = "demoseed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Seeds deterministic demo data into an already-running fleet through the gateway's
# public HTTP API only, so every row is written by its owning module. A client of the
# fleet, not a rollout: no database access. Its workspace-crate dependencies are the
# dependency-free `opscatalog` table, the authority for each call's route and for the
# end-of-run coverage check, and the `accountsapi` contract, the authority for the
# `clientId` every login call names.
[[bin]]
name = "demoseed"
path = "src/main.rs"

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
opscatalog = { workspace = true }
accountsapi = { workspace = true }
anyhow = { workspace = true }
